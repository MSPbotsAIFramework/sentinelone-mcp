[project]
name = "sentinelone-mcp"
version = "1.0.0"
description = "MCP server for SentinelOne (Purple AI, PowerQuery, alerts, vulnerabilities, misconfigurations, inventory, threat intel)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MSPbots.ai" }]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
    "purple-mcp",
]

[tool.uv.sources]
# SentinelOne's official MCP tool library (MIT), pinned to a reviewed commit.
purple-mcp = { git = "https://github.com/Sentinel-One/purple-mcp", rev = "e3060346cf8bbcaa60e1384ea7404fe058945604" }

[project.scripts]
sentinelone-mcp = "sentinelone_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelone_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
